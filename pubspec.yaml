publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # アイコン
  cupertino_icons: ^1.0.8

  # BLE通信
  flutter_blue_plus: ^1.32.0
  
  # URLを開く
  url_launcher: ^6.3.0
  
  # アプリ内ブラウザ
  webview_flutter: ^4.8.0
  
