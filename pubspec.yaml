  # 権限管理
  permission_handler: ^11.3.1
  
  # データ保存
  shared_preferences: ^2.5.4

  # --- 今回追加するパッケージ (Webスクレイピング用) ---
  http: ^1.2.0
  html: ^0.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true